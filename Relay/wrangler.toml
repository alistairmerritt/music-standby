# Music StandBy relay. `npm run dev` runs it locally; nothing here is deployed.
name = "music-standby-relay"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "PAIRING"
class_name = "Pairing"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Pairing", "Directory"]

[vars]
# "mock" records pushes instead of sending them. "apns" needs the secrets
# APNS_KEY_P8, APNS_KEY_ID and APNS_TEAM_ID (wrangler secret put …).
PUSH_MODE = "mock"
APNS_ENVIRONMENT = "development"
APNS_TOPIC = "com.alistairmerritt.MusicStandBy.push-type.nowplaying"
# Dev-only endpoints under /v1/dev/ (recorded pushes, the APNs probe). Off by
# default so a deployment can't expose them by accident; `npm run dev` and the
# tests turn them on.
DEV_ENDPOINTS = "0"
